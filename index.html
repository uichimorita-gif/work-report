<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>かんたん日報 第4号</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#1d2939;font-family:system-ui,-apple-system,sans-serif}main{max-width:680px;margin:auto;padding:18px}h1{font-size:24px;margin:8px 0}p{line-height:1.6;color:#526072}.sheet{background:white;padding:20px;border-radius:14px;box-shadow:0 2px 12px #0001}label{display:block;margin:15px 0 6px;font-weight:650}input,textarea{width:100%;padding:12px;border:1px solid #c9d3de;border-radius:8px;font:inherit;background:white}textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid label{margin-top:14px}.subhead{font-size:17px;border-bottom:1px solid #dce4ec;padding-bottom:7px;margin:24px 0 4px}canvas{display:block;width:100%;height:155px;border:1px dashed #9aa9b8;border-radius:8px;touch-action:none;background:white}button{font:inherit;font-weight:700;padding:13px 15px;border:0;border-radius:9px;background:#1767b3;color:white;cursor:pointer}.secondary{background:#e8eef5;color:#24354a}.danger{background:#a63838}.actions{display:grid;gap:10px;margin:18px 0}.hint{font-size:13px;color:#5d6b7b}.status{font-size:14px;min-height:22px}#printPage{display:none}.printSignature{max-width:100%;height:85px;object-fit:contain;object-position:left center}.printLine{border:1px solid #cdd4dc;padding:7px 10px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:42px}.printLabel{font-size:11px;color:#555;margin-bottom:3px}.printGrid{display:grid;grid-template-columns:1fr 1fr}.printWide{grid-column:1/-1}.printLong{min-height:78px}@media print{@page{size:A4;margin:13mm}body{background:white}main{display:none!important}#printPage{display:block!important;font-family:system-ui,sans-serif;color:black;font-size:12px}#printPage h2{border-bottom:2px solid #222;padding-bottom:9px}.printLine{break-inside:avoid}}
</style></head><body><main><h1>かんたん日報</h1><p>紙の日報と同じ。記入して、サインして、提出。日報をアプリ内に蓄積しません。</p><div class="sheet"><h2 class="subhead">基本情報</h2><label for="date">日付</label><input id="date" type="date"><label for="company">会社名</label><input id="company" autocomplete="off" placeholder="会社名"><label for="site">現場名</label><input id="site" autocomplete="off" placeholder="現場名"><label for="workers">作業者名</label><textarea id="workers" placeholder="複数名の場合は改行して入力"></textarea><label for="workerCount">作業人数</label><input id="workerCount" type="number" min="0" step="1" inputmode="numeric" placeholder="人数"><h2 class="subhead">残業（なければ空欄）</h2><label for="overtimeWorkers">残業者名</label><textarea id="overtimeWorkers" placeholder="複数名の場合は改行して入力"></textarea><div class="grid"><div><label for="overtimeCount">残業人数</label><input id="overtimeCount" type="number" min="0" step="1" inputmode="numeric" placeholder="人数"></div><div><label for="overtimeHours">残業時間</label><input id="overtimeHours" type="text" inputmode="decimal" placeholder="例：2時間 / 各1時間"></div></div><h2 class="subhead">作業内容</h2><label for="work">作業内容</label><textarea id="work" placeholder="作業内容を入力"></textarea><label for="materials">使用材料</label><textarea id="materials" placeholder="使用材料を入力"></textarea><label for="notes">備考</label><textarea id="notes" placeholder="備考"></textarea><h2 class="subhead">確認</h2><label>所属長サイン</label><canvas id="sign" width="900" height="310" aria-label="指で署名する欄"></canvas><button class="secondary" id="clearSign" type="button" style="margin-top:10px">サインを書き直す</button></div><div class="actions"><button id="pdf">① PDF保存・印刷</button><button class="secondary" id="share">② 会社へ共有（文章のみ）</button><button class="danger" id="clear">③ 提出後に用紙を消去</button></div><div id="status" class="status" role="status"></div><p class="hint">署名付きで提出する場合は①からPDF保存して、そのPDFを会社に送ってください。②の文章共有には署名が含まれません。送信完了をアプリが自動確認することはできません。提出先での受領を確認してから③を押してください。保存したPDFや送信履歴は別途残ることがあります。</p></main><div id="printPage"><h2>作業日報</h2><div id="printFields" class="printGrid"></div><div class="printLine"><div class="printLabel">所属長サイン</div><img id="printSign" class="printSignature" alt="署名"></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id);const fields=[['date','日付'],['company','会社名'],['site','現場名'],['workers','作業者名'],['workerCount','作業人数'],['overtimeWorkers','残業者名'],['overtimeCount','残業人数'],['overtimeHours','残業時間'],['work','作業内容'],['materials','使用材料'],['notes','備考']];const wide=new Set(['company','site','workers','overtimeWorkers','work','materials','notes']);const long=new Set(['workers','overtimeWorkers','work','materials','notes']);const canvas=$('sign'),ctx=canvas.getContext('2d');ctx.strokeStyle='#172b4d';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';let drawing=false,hasSign=false;function position(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;hasSign=true;canvas.setPointerCapture(e.pointerId);const p=position(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y+.01);ctx.stroke()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=position(e);ctx.lineTo(p.x,p.y);ctx.stroke()});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>drawing=false);function eraseSign(){ctx.clearRect(0,0,canvas.width,canvas.height);hasSign=false}$('clearSign').onclick=eraseSign;function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}$('date').value=today();function data(){return Object.fromEntries(fields.map(([id])=>[id,$(id).value]))}function buildPrint(){const d=data(),target=$('printFields');target.replaceChildren();for(const [id,name] of fields){const outer=document.createElement('div');outer.className='printLine'+(wide.has(id)?' printWide':'')+(long.has(id)?' printLong':'');const label=document.createElement('div');label.className='printLabel';label.textContent=name;const val=document.createElement('div');val.textContent=d[id]||' ';outer.append(label,val);target.append(outer)}$('printSign').src=hasSign?canvas.toDataURL('image/png'):''}function waitForSignature(){const img=$('printSign');if(!hasSign)return Promise.resolve();if(img.complete&&img.naturalWidth>0)return Promise.resolve();return new Promise((resolve,reject)=>{img.onload=()=>{img.onload=null;img.onerror=null;resolve()};img.onerror=()=>{img.onload=null;img.onerror=null;reject(new Error('署名画像を読み込めませんでした'))}})}function validate(){if(!$('company').value.trim()||!$('site').value.trim()||!$('workers').value.trim()){alert('会社名・現場名・作業者名を入力してください。');return false}return true}$('pdf').onclick=async()=>{if(!validate())return;const btn=$('pdf');btn.disabled=true;try{buildPrint();await waitForSignature();await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));window.print();$('status').textContent='印刷画面で「PDFとして保存」を選び、保存したPDFを会社へ送信してください。'}catch(e){$('status').textContent='署名の読み込みに失敗しました。もう一度お試しください。'}finally{btn.disabled=false}};$('share').onclick=async()=>{if(!validate())return;const d=data();const t='作業日報\n'+fields.map(([id,label])=>`${label}：${d[id]||''}`).join('\n')+'\n※所属長サインは含まれません。署名付き提出にはPDFをご利用ください。';try{if(navigator.share){await navigator.share({title:'作業日報',text:t})}else if(navigator.clipboard){await navigator.clipboard.writeText(t);$('status').textContent='文章をコピーしました。会社への送信はご自身で行ってください。'}else{$('status').textContent='共有できません。PDF保存をご利用ください。'}}catch(e){if(e.name!=='AbortError')$('status').textContent='共有できませんでした。PDF保存をご利用ください。'}};$('clear').onclick=()=>{if(!confirm('会社への提出と到着確認は済みましたか？\nこの用紙の入力内容とサインを消去します。元に戻せません。'))return;fields.forEach(([id])=>$(id).value='');$('date').value=today();eraseSign();$('printFields').replaceChildren();$('printSign').removeAttribute('src');$('status').textContent='用紙を消去しました。新しい日報を記入できます。';window.scrollTo({top:0,behavior:'smooth'})};window.addEventListener('beforeunload',e=>{if(fields.some(([id])=>id!=='date'&&$(id).value.trim())||hasSign){e.preventDefault();e.returnValue=''}});})();</script></body></html>
